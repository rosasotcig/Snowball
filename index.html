let binCache = null;
let binCacheLoaded = false;

async function fetchBin() {
  if (binCacheLoaded) return binCache;
  updateSaveStatus("saving");
  try {
    const res = await fetch("https://api.jsonbin.io/v3/b/" + JSONBIN_ID + "/latest", {
      headers: { "X-Master-Key": JSONBIN_KEY }
    });
    if (!res.ok) throw new Error("bin fetch failed: " + res.status);
    const data = await res.json();
    binCache = data.record || {};
    binCacheLoaded = true;
    updateSaveStatus("ok");
  } catch (e) {
    console.warn("JSONBin fetch failed, using local cache only:", e);
    updateSaveStatus("error");
    return {};
  }
  return binCache;
}

async function saveBin() {
  updateSaveStatus("saving");
  try {
    const res = await fetch("https://api.jsonbin.io/v3/b/" + JSONBIN_ID, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
      body: JSON.stringify(binCache)
    });
    if (!res.ok) throw new Error("bin save failed: " + res.status);
    updateSaveStatus("ok");
  } catch (e) {
    console.warn("JSONBin save failed, changes kept locally only:", e);
    updateSaveStatus("error");
  }
}

const storage = {
  async get(key) {
    const bin = await fetchBin();
    if (bin && bin[key] !== undefined) return { key: key, value: bin[key] };
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { key: key, value: v };
    } catch (e) { return null; }
  },
  async set(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
    const bin = await fetchBin();
    bin[key] = value;
    binCache = bin;
    await saveBin();
    return { key: key, value: value };
  }
};
function updateSaveStatus(state) {
  const bar = document.getElementById("sync-bar");
  const text = document.getElementById("sync-bar-text");
  const btn = document.getElementById("sync-bar-btn");
  if (!bar || !text) return;
  bar.style.display = "flex";
  if (state === "saving") {
    bar.style.background = "#f4f2ee";
    bar.style.color = "#6b6a65";
    text.textContent = "☁ Guardando...";
    if (btn) btn.style.display = "none";
  } else if (state === "ok") {
    const now = new Date();
    bar.style.background = "#e5f1e6";
    bar.style.color = "#2f6b3f";

    bar.style.color = "#b5432f";
    text.textContent = "☁ No se pudo guardar";
    if (btn) btn.style.display = "inline-block";
  }
}

function money(n) {
  const v = Number.isFinite(n) ? n : 0;
  return v.toLocaleString("en-US", { style: "currency", currency: "USD" });
}

function effectiveMinPayment(debt, calendarMonthISO) {
  let val = debt.minPayment;
  if (debt.schedule && debt.schedule.length) {
    const sorted = debt.schedule.slice().sort((a, b) => a.month.localeCompare(b.month));
    for (const s of sorted) {
      if (s.month.localeCompare(calendarMonthISO) <= 0) val = s.amount;
    }
  }
  return val;
}

function debtMinTotal(list, calendarMonthISO) {
  return list.reduce((s, d) => s + effectiveMinPayment(d, calendarMonthISO), 0);
}

function budgetTotal() {
  return budget.reduce((s, b) => s + (b.monto || 0), 0);
}
function variableExpensesTotal() {
  return variableExpenses.reduce((s, v) => s + (v.monto || 0), 0);
}

function totalGastos() {
  const nowMonth = currentMonthISO();
  const activeDebts = debts.filter((d) => d.balance > 0);
  return debtMinTotal(activeDebts, nowMonth) + budgetTotal() + variableExpensesTotal();
}

function extraDelMes() {
  const net = incomeTotal();
  return net - totalGastos();
}
function incomeTotal() {
  return income.reduce((s, i) => s + (i.amount || 0), 0);
}

function simulate(debtsInput, extraMonthly, startDateISO, maxMonths) {
  maxMonths = maxMonths || 240;
  const arr = debtsInput
    .filter((d) => d.balance > 0)
    .sort((a, b) => a.order - b.order)
    .map((d) => Object.assign({}, d, { currentBalance: d.balance }));

  const payoffMonths = {};
  let totalInterest = 0;
  let month = 0;

  if (arr.length === 0) return { months: 0, totalInterest: 0, payoffMonths: payoffMonths };

  while (arr.some((d) => d.currentBalance > 0.005) && month < maxMonths) {
    month += 1;
    const calMonth = addMonthsISO(startDateISO, month - 1);
    const freedMin = arr
      .filter((d) => d.currentBalance <= 0.005)
      .reduce((s, d) => s + effectiveMinPayment(d, calMonth), 0);
    let pool = extraMonthly + freedMin;

    for (const d of arr) {
      if (d.currentBalance <= 0.005) continue;
      const interest = d.currentBalance * (d.apr / 100 / 12);
      totalInterest += interest;
      const withInterest = d.currentBalance + interest;
      const effMin = effectiveMinPayment(d, calMonth);
      const minPay = Math.min(effMin, withInterest);
      const extraPay = Math.min(pool, Math.max(withInterest - minPay, 0));
      pool -= extraPay;
      const totalPay = minPay + extraPay;
      d.currentBalance = Math.max(withInterest - totalPay, 0);
      if (d.currentBalance <= 0.005 && payoffMonths[d.id] === undefined) {
        payoffMonths[d.id] = month;
      }
    }
  }
  return { months: month, totalInterest: totalInterest, payoffMonths: payoffMonths };
}

function moveDebt(id, direction) {
  const active = debts.filter((d) => d.balance > 0).sort((a, b) => a.order - b.order);
  const idx = active.findIndex((d) => d.id === id);
  const swapIdx = direction === "up" ? idx - 1 : idx + 1;
  if (swapIdx < 0 || swapIdx >= active.length) return;
  const a = active[idx], b = active[swapIdx];
  const next = debts.map((d) => {
    if (d.id === a.id) return Object.assign({}, d, { order: b.order });
    if (d.id === b.id) return Object.assign({}, d, { order: a.order });
    return d;
  });
  persistDebts(next);
}
function autoOrder() {
  const sorted = debts.filter((d) => d.balance > 0).sort((a, b) => a.balance - b.balance);
  const next = debts.map((d) => {
    const pos = sorted.findIndex((s) => s.id === d.id);
    if (pos === -1) return d;
    return Object.assign({}, d, { order: pos + 1 });
  });
  persistDebts(next);
}

    return Object.assign({}, d, { schedule: schedule });
  });
  persistDebts(next);
}

  });
  persistDebts(next);
}

function togglePaidMark(markKey, amount, accountId) {
  const wasPaid = !!paidMarks[markKey];
  const next = Object.assign({}, paidMarks);
  if (wasPaid) delete next[markKey];
  else next[markKey] = true;

  if (accountId) {
    const delta = wasPaid ? -amount : amount;
    const acct = settings.accounts.find((a) => a.id === accountId);
    const newBal = ((acct && acct.startingBalance) || 0) + delta;
    const nextAccounts = settings.accounts.map((a) => (a.id === accountId ? Object.assign({}, a, { startingBalance: Math.round(newBal * 100) / 100 }) : a));
    persistSettings(Object.assign({}, settings, { accounts: nextAccounts }));
  }
  persistPaidMarks(next);
}
async function startNewMonth() {
  const nowMonth = currentMonthISO();
  const preview = settings.accounts.map((a) => {
    const tl = buildMonthTimeline(a.id);
    return a.name + ": " + money(tl.endBalance);
  }).join("\n");
  if (!confirm("Esto va a:\n1) Guardar este mes en el historial\n2) Desmarcar todo lo de \"pagado\"\n3) Poner el saldo inicial de cada cuenta como el saldo proyectado de fin de mes\n4) Vaciar los gastos variables de este mes:\n\n" + preview + "\n\n¿Continuar?")) return;

  const endBalances = {};
  settings.accounts.forEach((a) => {
    const tl = buildMonthTimeline(a.id);
    endBalances[a.id] = Math.round(tl.endBalance * 100) / 100;
  });
  const historyEntry = {
    month: nowMonth,
    totalGastos: totalGastos(),
    totalIngresos: incomeTotal(),
    extra: extraDelMes(),
    endBalances: endBalances,
    variableExpensesSnapshot: variableExpenses,
    closedAt: new Date().toISOString(),
  };
  const nextHistory = monthHistory.filter((h) => h.month !== nowMonth).concat([historyEntry]);
  await persistMonthHistory(nextHistory);

  const nextAccounts = settings.accounts.map((a) => Object.assign({}, a, { startingBalance: endBalances[a.id] }));
  await persistSettings(Object.assign({}, settings, { accounts: nextAccounts }));
  await persistPaidMarks({});
  await persistVariableExpenses([]);
}

function buildMonthTimeline(accountId) {
  const nowMonth = currentMonthISO();
  const activeDebts = debts.filter((d) => d.balance > 0 && d.account === accountId);
  const events = [];

  income.filter((i) => i.account === accountId).forEach((i) => {
    events.push({ day: i.day || 1, label: i.name, sub: "ingreso", amount: i.amount || 0, key: "income:" + i.id });
  });

  activeDebts.forEach((d) => {
    events.push({ day: d.diaPago || 1, label: d.name, sub: "deuda", amount: -effectiveMinPayment(d, nowMonth), key: "debt:" + d.id });
  });

  budget.filter((b) => b.account === accountId).forEach((b) => {
    events.push({ day: b.dia || 1, label: b.name, sub: catLabel(b.cat).toLowerCase(), amount: -(b.monto || 0), variable: !!b.variable, key: "budget:" + b.id });
  });

  variableExpenses.filter((v) => v.account === accountId).forEach((v) => {
    events.push({ day: v.dia || 1, label: v.name, sub: "gasto variable del mes", amount: -(v.monto || 0), variable: true, key: "varexp:" + v.id });
  });

  events.sort((a, b) => (a.day - b.day) || (b.amount - a.amount));

  const acct = settings.accounts.find((a) => a.id === accountId);
  let running = (acct && acct.startingBalance) || 0;
  let lowestPoint = running;
  let lowestEvent = null;
  const rows = events.map((e) => {
    const markKey = e.key + "|" + nowMonth;
    const paid = !!paidMarks[markKey];
    if (!paid) {
      running += e.amount;
      if (running < lowestPoint) { lowestPoint = running; lowestEvent = e; }
    }
    return Object.assign({}, e, { running: running, markKey: markKey, paid: paid, accountId: accountId });
  });

  return { rows: rows, lowestPoint: lowestPoint, lowestEvent: lowestEvent, endBalance: running };
}

function buildCombinedTimeline() {
  const perAccount = settings.accounts.map((a) => {
    const tl = buildMonthTimeline(a.id);
    const taggedRows = tl.rows.map((r) => Object.assign({}, r, { accountId: a.id, accountName: a.name, accountColor: accountColor(a.id) }));
    return { account: a, timeline: tl, rows: taggedRows };
  });
  const allRows = [].concat(...perAccount.map((p) => p.rows)).sort((a, b) => (a.day - b.day) || (b.amount - a.amount));
  return { perAccount: perAccount, allRows: allRows };
}

    html += '<input class="bi-day" type="number" data-vfield="dia" data-vid="' + v.id + '" value="' + v.dia + '" style="width:44px" />';
    html += '<input class="bi-name" type="text" data-vfield="name" data-vid="' + v.id + '" value="' + v.name.replace(/"/g, '&quot;') + '" />';
    html += '<button class="del-btn" data-vdelete="' + v.id + '">' + icon("trash") + '</button>';
    html += '</div>';
    html += '<div style="display:flex;align-items:center;gap:6px">';
    html += '<select data-vfield="cat" data-vid="' + v.id + '" style="width:auto;flex:1">';
    cats.forEach((cc) => { html += '<option value="' + cc + '" ' + (cc === v.cat ? "selected" : "") + '>' + catLabel(cc) + '</option>'; });
    html += '</select>';
    html += '<select data-vfield="account" data-vid="' + v.id + '" style="width:56px">' + accountOptionsShortHtml(v.account) + '</select>';
    html += '<input class="bi-amount" type="number" step="0.01" data-vfield="monto" data-vid="' + v.id + '" value="' + v.monto + '" style="width:70px" />';
    html += '</div></div>';
  });
  html += '<button class="add-btn" id="add-varexp-btn">' + icon("plus") + ' Agregar gasto variable de este mes</button>';
  html += '<div class="budget-total-row"><span>Subtotal variables del mes</span><span>' + money(variableExpensesTotal()) + '</span></div>';

  const variableTotal = budget.filter((b) => b.variable).reduce((s, b) => s + (b.monto || 0), 0) + variableExpensesTotal();
  const fixedTotal = dTotal + budgetTotal() - budget.filter((b) => b.variable).reduce((s, b) => s + (b.monto || 0), 0);
  html += '<div class="fixed-var-split">';

  const grand = dTotal + cats.reduce((s, c) => s + catTotals[c], 0) + variableExpensesTotal();
  html += '<div class="grand-total"><span class="label">Total gastos del mes</span><span class="val">' + money(grand) + '</span></div>';

  if (monthHistory.length > 0) {
    const sorted = monthHistory.slice().sort((a, b) => b.month.localeCompare(a.month));
    const maxGasto = Math.max(...sorted.map((h) => h.totalGastos), grand);
    html += '<div class="budget-section-title" style="margin-top:1.5rem">Meses anteriores</div>';
    sorted.forEach((h) => {
      const pct = maxGasto > 0 ? Math.round((h.totalGastos / maxGasto) * 100) : 0;

      html += '</div>';
    });
  }

  return html;
}

  html += '<div class="stat"><div class="l">Saldo fin de mes</div><div class="v">' + money(tl.endBalance) + '</div></div>';
  html += '</div>';
  if (variableBeforeLow > 0) {

  }

  if (short) {
    html += '<div class="income-row" style="background:var(--danger-bg);border-color:var(--danger)"><div><div class="label" style="color:var(--danger)">Posible faltante</div>';
    html += '<div class="sub" style="color:var(--danger)">Te faltarían ' + money(Math.abs(tl.lowestPoint)) + ' el día ' + (tl.lowestEvent ? tl.lowestEvent.day : "?") + '</div></div></div>';
  }

  html += '<div class="section-head" style="margin-top:1rem"><span class="title">Movimientos del mes</span></div>';
  html += '<div class="debt-list">';
  tl.rows.forEach((e) => {
    const isIncome = e.amount >= 0;
    const negBalance = e.running < 0;
    html += '<div class="budget-item readonly' + (e.variable ? ' is-variable' : '') + '" style="border-color:' + (negBalance ? "var(--danger)" : (e.variable ? "var(--purple)" : "var(--border)")) + (e.paid ? ";opacity:0.5" : "") + '">';
    html += '<button aria-label="Marcar pagado" data-toggle-paid-mark="' + e.markKey + '" data-toggle-amount="' + e.amount + '" data-toggle-account="' + e.accountId + '" style="border:1px solid ' + (e.paid ? "var(--success)" : "var(--border)") + ';background:' + (e.paid ? "var(--success)" : "#fff") + ';color:' + (e.paid ? "#fff" : "var(--text-muted)") + ';border-radius:6px;width:22px;height:22px;flex-shrink:0;padding:0;display:flex;align-items:center;justify-content:center">' + (e.paid ? "✓" : "") + '</button>';
    html += '<span class="bi-day">día ' + e.day + '</span>';
    html += '<span class="bi-name" style="' + (e.paid ? "text-decoration:line-through" : "") + '">' + e.label + '<div style="font-size:10px;color:var(--text-muted)">' + e.sub + (e.variable ? " · variable" : "") + '</div></span>';
    html += '<span class="bi-amount-static" style="color:' + (isIncome ? "var(--success)" : "var(--text)") + '">' + (isIncome ? "+" : "") + (e.variable ? "~" : "") + money(e.amount) + '</span>';
    html += '<span class="bi-amount-static" style="color:' + (negBalance ? "var(--danger)" : "var(--text-muted)") + ';font-weight:' + (negBalance ? "700" : "400") + '">' + money(e.running) + '</span>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="extra-link-note">Marca ✓ lo que ya salió de tu cuenta este mes. Los días vienen de Deudas, Presupuesto e Ingresos.</div>';

  return html;
}

async function exportAllData() {
  const data = {
    debts: debts,
    income: income,
    budget: budget,
    settings: settings,
    notesText: notesText,
    planning: planning,
    paidMarks: paidMarks,
    variableExpenses: variableExpenses,
    monthHistory: monthHistory,
    aldoExpenses: aldoExpenses,
    exportedAt: new Date().toISOString(),
  };
  return JSON.stringify(data, null, 2);
}
async function importAllData(jsonStr) {
  let data;
  try {
    data = JSON.parse(jsonStr);
  } catch (e) {
    alert("Ese texto no es JSON válido. Revisa que lo hayas copiado completo.");
    return false;
  }
  if (!data || typeof data !== "object") {
    alert("Ese JSON no tiene el formato esperado.");
    return false;
  }
  if (data.debts) await persistDebts(data.debts);
  if (data.income) await persistIncome(migrateIncome(data.income));
  if (data.budget) await persistBudget(data.budget);
  if (data.settings) await persistSettings(data.settings);
  if (data.notesText !== undefined) await persistNotesText(data.notesText);
  if (data.planning) await persistPlanning(data.planning);
  if (data.paidMarks) await persistPaidMarks(data.paidMarks);
  if (data.variableExpenses) await persistVariableExpenses(data.variableExpenses);
  if (data.monthHistory) await persistMonthHistory(data.monthHistory);
  if (data.aldoExpenses) await persistAldoExpenses(data.aldoExpenses);
  render();
  return true;
}

function renderDeudasTab() {
  const extra = extraDelMes();
  const startDate = settings.startDate;
  const activeDebts = debts.filter((d) => d.balance > 0).sort((a, b) => a.order - b.order);
  const paidDebts = debts.filter((d) => d.balance <= 0);
  const totalBalance = activeDebts.reduce((s, d) => s + d.balance, 0);
  const sim = simulate(activeDebts, extra || 0, startDate);

  let html = "";
  html += '<h1>' + icon("snow") + ' Tu snowball de deudas</h1>';

  html += '<div class="start-row"><span class="label">' + icon("calendar") + ' Empiezas a pagar en</span>';
  html += '<input type="month" id="start-date-input" value="' + startDate + '" /></div>';

  html += '<div class="extra-row"><div><div class="label">Extra del mes</div><div class="sub">Desde la pestaña Ingresos</div></div>';
  html += '<div style="font-size:16px;font-weight:700">' + money(extra) + '</div></div>';

  html += '<div class="summary">';
  html += '<div class="stat"><div class="l">Deuda total</div><div class="v">' + money(totalBalance) + '</div></div>';
  html += '<div class="stat"><div class="l">Libre en</div><div class="v">' + (sim.months ? sim.months + ' meses' : "🎉") + '</div>';
  html += '<div class="d">' + (sim.months ? monthLabelISO(addMonthsISO(startDate, sim.months - 1)) : "sin deuda") + '</div></div>';
  html += '</div>';

  html += '<div class="section-head"><span class="title">Deudas activas</span>';
  html += '<button class="mini" id="auto-order-btn">' + icon("reset") + ' Ordenar por balance</button></div>';

  html += '<div class="debt-list">';
  if (activeDebts.length === 0) {
    html += '<div class="empty">No tienes deudas activas.</div>';
  }
  activeDebts.forEach((d, i) => {
    const payoffMonth = sim.payoffMonths[d.id];
    const isExpanded = !!expandedSchedules[d.id];
    html += '<div class="debt-card">';
    html += '<div class="debt-top">';
    html += '<div class="order-btns">';
    html += '<button aria-label="Subir orden" data-move-up="' + d.id + '" ' + (i === 0 ? "disabled" : "") + '>' + icon("up") + '</button>';
    html += '<button aria-label="Bajar orden" data-move-down="' + d.id + '" ' + (i === activeDebts.length - 1 ? "disabled" : "") + '>' + icon("down") + '</button>';
    html += '</div>';
    html += '<div class="debt-fields">';
    html += '<input class="name-input" type="text" data-field="name" data-id="' + d.id + '" value="' + d.name.replace(/"/g, '&quot;') + '" />';
    html += '<div class="field-grid">';
    html += '<div><label>Balance</label><input type="number" step="0.01" data-field="balance" data-id="' + d.id + '" value="' + d.balance + '" /></div>';
    html += '<div><label>APR %</label><input type="number" step="0.01" data-field="apr" data-id="' + d.id + '" value="' + d.apr + '" /></div>';
    html += '<div><label>Mínimo base</label><input type="number" step="0.01" data-field="minPayment" data-id="' + d.id + '" value="' + d.minPayment + '" /></div>';
    html += '<div><label>Día de pago</label><input type="number" min="1" max="31" data-field="diaPago" data-id="' + d.id + '" value="' + d.diaPago + '" /></div>';
    html += '<div><label>Cuenta</label><select data-field="account" data-id="' + d.id + '">' + accountOptionsHtml(d.account) + '</select></div>';
    html += '</div></div>';
    html += '<button class="del-btn" aria-label="Eliminar deuda" data-delete="' + d.id + '">' + icon("trash") + '</button>';
    html += '</div>';
    if (payoffMonth) {
      html += '<div class="payoff-note">Se paga en ' + payoffMonth + (payoffMonth === 1 ? ' mes' : ' meses') + ' · ' + monthLabelISO(addMonthsISO(startDate, payoffMonth - 1)) + '</div>';
    }
    const schedCount = (d.schedule || []).length;
    html += '<button class="sched-toggle" data-toggle-sched="' + d.id + '">' + (isExpanded ? "Ocultar" : "Cambios de pago mínimo") + (schedCount ? " (" + schedCount + ")" : "") + '</button>';
    if (isExpanded) {
      html += '<div class="sched-box">';
      (d.schedule || []).slice().sort((a, b) => a.month.localeCompare(b.month)).forEach((s) => {
        html += '<span class="sched-chip">' + monthShortLabelISO(s.month) + ': ' + money(s.amount) + '<button data-sched-delete="' + d.id + '|' + s.id + '">' + icon("trash") + '</button></span>';
      });
      html += '<div class="sched-add">';
      html += '<input type="month" id="sched-month-' + d.id + '" />';
      html += '<input type="number" step="0.01" id="sched-amount-' + d.id + '" placeholder="$" />';
      html += '<button data-sched-add="' + d.id + '">' + icon("plus") + '</button>';
      html += '</div></div>';
    }
    html += '</div>';
  });
  html += '</div>';

  html += '<button class="add-btn" id="add-debt-btn">' + icon("plus") + ' Agregar deuda</button>';

  if (paidDebts.length > 0) {
    html += '<button class="paid-toggle" id="toggle-paid-btn"><span style="display:flex;align-items:center;gap:6px">' + icon("party") + ' Pagadas (' + paidDebts.length + ')</span>';
    html += '<span class="chev ' + (showPaid ? "open" : "") + '">' + icon("chev") + '</span></button>';
    if (showPaid) {
      html += '<div class="paid-list">';
      paidDebts.forEach((d) => {
        html += '<div class="paid-item"><span>' + d.name + '</span>';
        html += '<div style="display:flex;gap:10px;align-items:center">';
        html += '<button aria-label="Reactivar deuda" data-reactivate="' + d.id + '" style="text-decoration:none">' + icon("reset") + '</button>';
        html += '<button aria-label="Eliminar de la lista" data-delete="' + d.id + '">' + icon("trash") + '</button>';
        html += '</div></div>';
      });
      html += '</div>';
    }
  }

  return html;
}

function render() {
  const app = document.getElementById("app");
  let body;
  if (activeTab === "deudas") body = renderDeudasTab();
  else if (activeTab === "ingresos") body = renderIngresosTab();
  else if (activeTab === "presupuesto") body = renderPresupuestoTab();
  else if (activeTab === "calendario") body = renderCalendarioTab();
  else body = renderNotasTab();

  app.innerHTML = renderTabs() + body;

  app.querySelectorAll("[data-tab]").forEach((el) => {
    el.addEventListener("click", () => setTab(el.getAttribute("data-tab")));
  });
  app.querySelectorAll("[data-goto]").forEach((el) => {
    el.addEventListener("click", () => setTab(el.getAttribute("data-goto")));
  });

  if (activeTab === "ingresos") {
    const addIncBtn = document.getElementById("add-income-btn");
    if (addIncBtn) addIncBtn.addEventListener("click", addIncomeEntry);
    app.querySelectorAll("[data-ifield]").forEach((el) => {
      el.addEventListener("change", (e) => {
        const id = e.target.getAttribute("data-iid");
        const field = e.target.getAttribute("data-ifield");
        const value = (field === "name" || field === "account") ? e.target.value : (parseFloat(e.target.value) || 0);
        updateIncomeEntryField(id, field, value);
      });
    });
    app.querySelectorAll("[data-idelete]").forEach((el) => {
      el.addEventListener("click", () => deleteIncomeEntry(el.getAttribute("data-idelete")));
    });
    return;
  }

  if (activeTab === "presupuesto") {
    const addBtn = document.getElementById("add-budget-btn");
    if (addBtn) addBtn.addEventListener("click", addBudgetItem);
    app.querySelectorAll("[data-bfield]").forEach((el) => {
      el.addEventListener("change", (e) => {
        const id = e.target.getAttribute("data-bid");
        const field = e.target.getAttribute("data-bfield");
        let value;
        if (field === "variable") value = e.target.checked;
        else if (field === "name" || field === "cat" || field === "account") value = e.target.value;
        else value = parseFloat(e.target.value) || 0;
        updateBudgetField(id, field, value);
      });
    });
    app.querySelectorAll("[data-bdelete]").forEach((el) => {
      el.addEventListener("click", () => deleteBudgetItem(el.getAttribute("data-bdelete")));
    });
    const addVarBtn = document.getElementById("add-varexp-btn");
    if (addVarBtn) addVarBtn.addEventListener("click", addVarExp);
    app.querySelectorAll("[data-vfield]").forEach((el) => {
      el.addEventListener("change", (e) => {
        const id = e.target.getAttribute("data-vid");
        const field = e.target.getAttribute("data-vfield");
        const value = (field === "name" || field === "cat" || field === "account") ? e.target.value : (parseFloat(e.target.value) || 0);
        updateVarExpField(id, field, value);
      });
    });
    app.querySelectorAll("[data-vdelete]").forEach((el) => {
      el.addEventListener("click", () => deleteVarExp(el.getAttribute("data-vdelete")));
    });
    return;
  }

  if (activeTab === "calendario") {
    app.querySelectorAll("[data-cal-account]").forEach((el) => {
      el.addEventListener("click", () => setCalendarAccount(el.getAttribute("data-cal-account")));
    });
    const balInput = document.getElementById("starting-balance-input");
    if (balInput) balInput.addEventListener("change", (e) => updateAccountBalance(calendarAccount, parseFloat(e.target.value) || 0));
    app.querySelectorAll("[data-account-balance]").forEach((el) => {
      el.addEventListener("change", (e) => updateAccountBalance(el.getAttribute("data-account-balance"), parseFloat(e.target.value) || 0));
    });
    app.querySelectorAll("[data-toggle-paid-mark]").forEach((el) => {
      el.addEventListener("click", () => togglePaidMark(
        el.getAttribute("data-toggle-paid-mark"),
        parseFloat(el.getAttribute("data-toggle-amount")) || 0,
        el.getAttribute("data-toggle-account")
      ));
    });
    const newMonthBtn = document.getElementById("new-month-btn");
    if (newMonthBtn) newMonthBtn.addEventListener("click", startNewMonth);
    return;
  }

  if (activeTab === "notas") {
    const ta = document.getElementById("notes-textarea");
    if (ta) {
      ta.addEventListener("change", (e) => persistNotesText(e.target.value));
      ta.addEventListener("blur", (e) => persistNotesText(e.target.value));
    }
    const addPlanBtn = document.getElementById("add-planning-btn");
    if (addPlanBtn) addPlanBtn.addEventListener("click", addPlanningItem);
    app.querySelectorAll("[data-pfield]").forEach((el) => {
      el.addEventListener("change", (e) => {
        const id = e.target.getAttribute("data-pid");
        const field = e.target.getAttribute("data-pfield");
        const value = (field === "monto") ? (parseFloat(e.target.value) || 0) : e.target.value;
        updatePlanningField(id, field, value);
      });
    });
    app.querySelectorAll("[data-pdelete]").forEach((el) => {
      el.addEventListener("click", () => deletePlanningItem(el.getAttribute("data-pdelete")));
    });

    const addAldoBtn = document.getElementById("add-aldo-btn");
    if (addAldoBtn) addAldoBtn.addEventListener("click", addAldoExp);
    app.querySelectorAll("[data-aefield]").forEach((el) => {
      el.addEventListener("change", (e) => {
        const id = e.target.getAttribute("data-aeid");
        const field = e.target.getAttribute("data-aefield");
        const value = (field === "monto") ? (parseFloat(e.target.value) || 0) : e.target.value;
        updateAldoExpField(id, field, value);
      });
    });
    app.querySelectorAll("[data-aedelete]").forEach((el) => {
      el.addEventListener("click", () => deleteAldoExp(el.getAttribute("data-aedelete")));
    });

    const exportBtn = document.getElementById("export-btn");
    if (exportBtn) {
      exportBtn.addEventListener("click", async () => {
        const json = await exportAllData();
        const area = document.getElementById("export-area");
        if (area) area.value = json;
        try {
          await navigator.clipboard.writeText(json);
          exportBtn.textContent = "¡Copiado!";
          setTimeout(() => { exportBtn.innerHTML = icon("list") + " Copiar mis datos"; }, 1500);
        } catch (e) {
          if (area) { area.focus(); area.select(); }
        }
      });
    }

    const importBtn = document.getElementById("import-btn");
    if (importBtn) {
      importBtn.addEventListener("click", async () => {
        const area = document.getElementById("import-area");
        const text = area ? area.value.trim() : "";
        if (!text) { alert("Pega el JSON primero."); return; }
        if (!confirm("Esto va a reemplazar TODOS tus datos actuales (deudas, ingresos, presupuesto, notas) con lo que pegaste. ¿Seguro?")) return;
        await importAllData(text);
      });
    }
    return;
  }

  const startInput = document.getElementById("start-date-input");
  if (startInput) startInput.addEventListener("change", (e) => updateStartDate(e.target.value));

  const autoBtn = document.getElementById("auto-order-btn");
  if (autoBtn) autoBtn.addEventListener("click", autoOrder);

  const addBtn = document.getElementById("add-debt-btn");
  if (addBtn) addBtn.addEventListener("click", addDebt);

  const toggleBtn = document.getElementById("toggle-paid-btn");
  if (toggleBtn) toggleBtn.addEventListener("click", togglePaid);

  app.querySelectorAll("[data-field]").forEach((el) => {
    el.addEventListener("change", (e) => {
      const id = e.target.getAttribute("data-id");
      const field = e.target.getAttribute("data-field");
      const value = (field === "name" || field === "account") ? e.target.value : (parseFloat(e.target.value) || 0);
      updateField(id, field, value);
    });
  });
  app.querySelectorAll("[data-move-up]").forEach((el) => {
    el.addEventListener("click", () => moveDebt(el.getAttribute("data-move-up"), "up"));
  });
  app.querySelectorAll("[data-move-down]").forEach((el) => {
    el.addEventListener("click", () => moveDebt(el.getAttribute("data-move-down"), "down"));
  });
  app.querySelectorAll("[data-delete]").forEach((el) => {
    el.addEventListener("click", () => deleteDebt(el.getAttribute("data-delete")));
  });
  app.querySelectorAll("[data-reactivate]").forEach((el) => {
    el.addEventListener("click", () => reactivateDebt(el.getAttribute("data-reactivate")));
  });
  app.querySelectorAll("[data-toggle-sched]").forEach((el) => {
    el.addEventListener("click", () => toggleSchedule(el.getAttribute("data-toggle-sched")));
  });
  app.querySelectorAll("[data-sched-delete]").forEach((el) => {
    el.addEventListener("click", () => {
      const parts = el.getAttribute("data-sched-delete").split("|");
      deleteScheduleEntry(parts[0], parts[1]);
    });
  });
  app.querySelectorAll("[data-sched-add]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-sched-add");
      const monthVal = document.getElementById("sched-month-" + id).value;
      const amountVal = document.getElementById("sched-amount-" + id).value;
      addScheduleEntry(id, monthVal, amountVal);
    });
  });
}

async function init() {
  let loadedDebts = DEFAULT_DEBTS;
  let loadedIncome = DEFAULT_INCOME;
  let loadedBudget = DEFAULT_BUDGET;
  let loadedSettings = { startDate: currentMonthISO(), accounts: DEFAULT_ACCOUNTS };
  let loadedNotesText = "";
  let loadedPlanning = DEFAULT_PLANNING;
  let loadedPaidMarks = {};
  let loadedVariableExpenses = [];
  let loadedMonthHistory = [];
  let loadedAldoExpenses = [];
  try {
    const d = await storage.get("snowball_debts");
    if (d && d.value) loadedDebts = JSON.parse(d.value);
  } catch (e) {}
  try {
    const inc = await storage.get("snowball_income");
    if (inc && inc.value) loadedIncome = migrateIncome(JSON.parse(inc.value));
  } catch (e) {}
  try {
    const bud = await storage.get("snowball_budget");
    if (bud && bud.value) loadedBudget = JSON.parse(bud.value);
  } catch (e) {}
  try {
    const set = await storage.get("snowball_settings");
    if (set && set.value) loadedSettings = JSON.parse(set.value);
  } catch (e) {}
  try {
    const nt = await storage.get("snowball_notes_text");
    if (nt && nt.value) loadedNotesText = JSON.parse(nt.value);
  } catch (e) {}
  try {
    const pl = await storage.get("snowball_planning");
    if (pl && pl.value) loadedPlanning = JSON.parse(pl.value);
  } catch (e) {}
  try {
    const pm = await storage.get("snowball_paid_marks");
    if (pm && pm.value) loadedPaidMarks = JSON.parse(pm.value);
  } catch (e) {}
  try {
    const ve = await storage.get("snowball_variable_expenses");
    if (ve && ve.value) loadedVariableExpenses = JSON.parse(ve.value);
  } catch (e) {}
  try {
    const mh = await storage.get("snowball_month_history");
    if (mh && mh.value) loadedMonthHistory = JSON.parse(mh.value);
  } catch (e) {}
  try {
    const ae = await storage.get("snowball_aldo_expenses");
    if (ae && ae.value) loadedAldoExpenses = JSON.parse(ae.value);
  } catch (e) {}
  debts = loadedDebts;
  income = loadedIncome;
  budget = loadedBudget;
  settings = loadedSettings;
  notesText = loadedNotesText;
  planning = loadedPlanning;
  paidMarks = loadedPaidMarks;
  variableExpenses = loadedVariableExpenses;
  monthHistory = loadedMonthHistory;
  aldoExpenses = loadedAldoExpenses;
  render();
}

init();
</script>
</body>
</html>
